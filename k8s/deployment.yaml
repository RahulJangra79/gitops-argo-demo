apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
      - name: myapp
        image: rahuljangra/myapp:e7c543cbe1a7c22651953529ab8d97836a91aca7
        ports:
        - containerPort: 3000
